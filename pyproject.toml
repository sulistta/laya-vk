[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya"
version = "0.3.4"
description = "Fast, non-autoregressive System 1 decision engine with calibrated probabilities (Vulkan/IREE port)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Convai Innovations" },
]
keywords = [
  "decision-model",
  "rlcd",
  "calibration",
  "system-one",
  "routing",
  "guardrails",
  "moderation",
  "triage",
  "vulkan",
  "iree",
  "gpu",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0.0",
  "transformers>=4.45.0",
  "safetensors>=0.4.0",
  "huggingface_hub>=0.20.0",
  "numpy>=1.20.0",
  "iree-base-runtime>=3.11.0",
]

[project.optional-dependencies]
export = [
  "onnx>=1.16",
  "onnxscript>=0.1",
  "iree-base-compiler>=3.11.0",
]
dev = [
  "pytest>=8",
  "rich>=13",
  "Pillow>=10",
]

[project.scripts]
laya-snake = "snake.cli:main"

[project.urls]
Upstream = "https://github.com/NandhaKishorM/laya"
Homepage = "https://huggingface.co/convaiinnovations/laya"

[tool.hatch.build.targets.wheel]
packages = ["laya", "snake"]

[tool.hatch.build.targets.sdist]
include = ["/laya", "/snake", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires downloaded Laya checkpoints or compiled Vulkan artifacts",
]

[tool.ruff]
line-length = 100
extend-exclude = [".upstream"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
